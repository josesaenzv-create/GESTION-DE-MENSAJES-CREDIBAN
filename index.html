    <div id="root"></div>
    <script type="text/babel">

        const initialData = [];

        const LLAMADA_OPTIONS = [
            "Pendiente",
            "Contestó Positivo",
            "Promesa Pago",
            "No Contesta",
            "Nro. Equivocado",
            "Bloqueado"
        ];

        const WA_OPTIONS = [
            "Pendiente",
            "Respondió",
            "Promesa Pago",
            "No Responde",
            "Bloqueado"
        ];

        const priorityScore = (val) => {
            if (!val) return 99;
            if (val.includes('Promesa')) return 1;
            if (val.includes('Positivo') || val.includes('Respondió')) return 2;
            if (val === 'Pendiente') return 3;
            if (val.includes('No Contesta') || val.includes('No Responde')) return 4;
            return 5; 
        };

        const getBestPriority = (client) => {
            return Math.min(priorityScore(client.estadoLlamada), priorityScore(client.estadoWA));
        };

        const getDropdownColor = (val) => {
            if (val.includes('Positivo') || val.includes('Respondió')) return 'bg-green-100 text-green-800 border-green-300';
            if (val.includes('Promesa')) return 'bg-blue-100 text-blue-800 border-blue-300';
            if (val.includes('No Contesta') || val.includes('No Responde')) return 'bg-yellow-100 text-yellow-800 border-yellow-300';
            if (val.includes('Equivocado') || val.includes('Bloqueado')) return 'bg-red-100 text-red-800 border-red-300';
            return 'bg-white text-gray-700 border-gray-300';
        };

        const stripEmojis = (str) => {
            if (!str) return '';
            return str.replace(/[📞📱🚫🚨✅⚠️💬📲]/g, '').trim();
        };

        const toTitleCase = (str) => {
            if (!str) return '';
            return str.replace(/\w\S*/g, (txt) => {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            }).replace(/\s+/g, ' ').trim(); 
        };

        const parseNumber = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            const strVal = String(val).replace(/,/g, '').trim();
            return parseFloat(strVal) || 0;
        };

        const parseCSVLineSafe = (line, separator) => {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === separator && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(s => s.trim().replace(/^"|"$/g, ''));
        };

        const findCol = (headers, possibleNames) => {
            for (let name of possibleNames) {
                const idx = headers.findIndex(h => h === name.toUpperCase());
                if (idx !== -1) return idx;
            }
            for (let name of possibleNames) {
                const idx = headers.findIndex(h => h.includes(name.toUpperCase()));
                if (idx !== -1) return idx;
            }
            return -1;
        };

        const parseCSV = (csvText) => {
            const lines = csvText.split('\n');
            let headerIdx = -1;
            let sep = ',';
            let headers = [];
            
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].includes('CLIENTE,CREDITO') || lines[i].includes('CLIENTE;CREDITO') || lines[i].includes('NOMBRES')) {
                    headerIdx = i;
                    sep = lines[i].includes(';') ? ';' : ',';
                    headers = parseCSVLineSafe(lines[i], sep).map(h => h.toUpperCase().trim());
                    break;
                }
            }

            if (headerIdx === -1) return [];

            const colIdx = {
                nombres: findCol(headers, ['NOMBRES CLIENTE', 'NOMBRES', 'CLIENTE']),
                telefono: findCol(headers, ['TELEFONO', 'TELÉFONO', 'CELULAR']),
                cuotaNum: findCol(headers, ['#CUOTA', 'N°', 'N CUOTA', 'CUOTA']),
                atraso: findCol(headers, ['ATRASO', 'DIAS ATRASO']),
                cuotaOri: findCol(headers, ['CUOTA_ORI', 'CUOTA ORI', 'SALDO SIN MORA']),
                moraGen: findCol(headers, ['MORA_GENERADA', 'MORA GEN', 'INT. MORA']),
                saldoCuota: findCol(headers, ['SALDO CUOTA', 'MONTO', 'TOTAL VENCIDO']),
                plazo: findCol(headers, ['PLAZO', 'TIPO']),
                desembolso: findCol(headers, ['DESEMBOLSO']),
                saldoK: findCol(headers, ['SALDO K', 'SALDO CAPITAL', 'CAPITAL'])
            };

            // Respaldos
            if(colIdx.nombres === -1) colIdx.nombres = 2;
            if(colIdx.telefono === -1) colIdx.telefono = 3;
            if(colIdx.cuotaNum === -1) colIdx.cuotaNum = 6;
            if(colIdx.atraso === -1) colIdx.atraso = 7;
            if(colIdx.cuotaOri === -1) colIdx.cuotaOri = 8;
            if(colIdx.moraGen === -1) colIdx.moraGen = 9;
            if(colIdx.saldoCuota === -1) colIdx.saldoCuota = 10;
            if(colIdx.plazo === -1) colIdx.plazo = 15;
            if(colIdx.desembolso === -1) colIdx.desembolso = 13;
            if(colIdx.saldoK === -1) colIdx.saldoK = 14; 

            const data = [];
            let currentNombre = 'Desconocido';
            let currentTelefono = 'Sin número';
            let currentAsesor = 'Sin Asesor';

            for (let i = headerIdx + 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const cols = parseCSVLineSafe(line, sep);
                if (cols.every(c => !c || c.trim() === '')) continue;
                
                const nombreRaw = cols[colIdx.nombres];
                if (nombreRaw && nombreRaw.includes('ASESOR:')) {
                    currentAsesor = nombreRaw.replace('ASESOR:', '').trim();
                    continue; 
                }
                if (nombreRaw && nombreRaw.trim() !== '') currentNombre = nombreRaw;
                if (colIdx.telefono !== -1 && cols[colIdx.telefono] && cols[colIdx.telefono].trim() !== '') {
                    currentTelefono = cols[colIdx.telefono];
                }

                const cuotaMonto = colIdx.saldoCuota !== -1 ? parseNumber(cols[colIdx.saldoCuota]) : 0;
                const cuotaOri = colIdx.cuotaOri !== -1 ? parseNumber(cols[colIdx.cuotaOri]) : 0;
                const moraGen = colIdx.moraGen !== -1 ? parseNumber(cols[colIdx.moraGen]) : Math.max(0, cuotaMonto - cuotaOri);
                const atraso = colIdx.atraso !== -1 ? parseInt(cols[colIdx.atraso]) : 0;
                const desembolso = colIdx.desembolso !== -1 ? parseNumber(cols[colIdx.desembolso]) : 0;
                const saldoKVal = colIdx.saldoK !== -1 ? parseNumber(cols[colIdx.saldoK]) : 0;
                
                const cuotaStr = colIdx.cuotaNum !== -1 ? cols[colIdx.cuotaNum] : '';
                const cuotaNumValue = parseInt(cuotaStr);
                
                const plazoStr = colIdx.plazo !== -1 ? cols[colIdx.plazo] : '';
                let totalPlazoValue = 0;
                if (plazoStr) {
                    const match = String(plazoStr).match(/(\d+)/); 
                    if (match) totalPlazoValue = parseInt(match[1]);
                }

                if (!isNaN(cuotaMonto) && !isNaN(atraso) && cuotaMonto !== 0) {
                    data.push({
                        nombre: currentNombre,
                        celular: currentTelefono,
                        asesor: currentAsesor,
                        cuotaMonto: cuotaMonto,
                        cuotaOri: cuotaOri,
                        moraGen: moraGen,
                        atraso: atraso,
                        desembolso: desembolso,
                        saldoK: saldoKVal,
                        cuotaActual: isNaN(cuotaNumValue) ? 0 : cuotaNumValue,
                        plazoTotal: totalPlazoValue
                    });
                }
            }
            return data;
        };

        const consolidateData = (data) => {
            const grouped = {};
            data.forEach(row => {
                if (!grouped[row.nombre]) {
                    grouped[row.nombre] = {
                        id: row.nombre,
                        nombre: row.nombre,
                        celular: row.celular,
                        asesor: row.asesor,
                        
                        montoDesembolsado: 0,
                        saldoCapital: 0, 
                        cuotaBase: 0,
                        deudaTotalRestante: 0, 
                        
                        cuotaOriginalVencida: 0,
                        moraGeneradaVencida: 0,
                        totalCobrarHoy: 0, 
                        
                        cuotaMasAntiguaBase: 0,
                        cuotaMasAntiguaTotal: 0,
                        
                        cuotasAtrasadas: 0, 
                        cuotasVenceHoy: 0,  
                        totalCuotasPendientes: 0,
                        
                        maxAtraso: -9999,
                        minCuotaPendiente: 9999,
                        plazoTotalCredito: 0,
                        
                        estadoLlamada: 'Pendiente',
                        estadoWA: 'Pendiente',
                        selected: false
                    };
                }
                
                const g = grouped[row.nombre];
                
                if (row.desembolso > g.montoDesembolsado) g.montoDesembolsado = row.desembolso;
                if (row.saldoK > g.saldoCapital) g.saldoCapital = row.saldoK;
                if (row.cuotaOri > g.cuotaBase) g.cuotaBase = row.cuotaOri;
                
                if (row.atraso > g.maxAtraso) {
                    g.maxAtraso = row.atraso;
                    g.cuotaMasAntiguaBase = row.cuotaOri;
                    g.cuotaMasAntiguaTotal = row.cuotaMonto;
                }
                
                if (row.cuotaActual > 0 && row.cuotaActual < g.minCuotaPendiente) g.minCuotaPendiente = row.cuotaActual;
                if (row.plazoTotal > g.plazoTotalCredito) g.plazoTotalCredito = row.plazoTotal;
                
                g.deudaTotalRestante += row.cuotaMonto;
                g.totalCuotasPendientes += 1;
                
                if (row.atraso >= 0) {
                    g.totalCobrarHoy += row.cuotaMonto;
                    g.cuotaOriginalVencida += row.cuotaOri;
                    g.moraGeneradaVencida += row.moraGen;
                }
                
                if (row.atraso > 0) g.cuotasAtrasadas += 1;
                if (row.atraso === 0) g.cuotasVenceHoy += 1;
            });
            
            return Object.values(grouped).map(client => {
                if (client.maxAtraso > 0) client.condicion = 'En Mora';
                else if (client.maxAtraso === 0) client.condicion = 'Vence Hoy';
                else client.condicion = 'Por Vencer';

                let cuotasPagadas = client.minCuotaPendiente === 9999 ? 0 : Math.max(0, client.minCuotaPendiente - 1);
                client.avancePorcentaje = client.plazoTotalCredito > 0 ? (cuotasPagadas / client.plazoTotalCredito) * 100 : 0;
                
                let cuotasRestantes = client.plazoTotalCredito > 0 ? (client.plazoTotalCredito - cuotasPagadas) : 0;
                client.montoCancelarCapInt = cuotasRestantes * client.cuotaBase;

                return client;
            }).filter(client => client.deudaTotalRestante > 0);
        };

        const formatPhoneNumber = (phone) => {
            let cleaned = phone.replace(/\D/g, '');
            if (cleaned.length === 9) cleaned = '51' + cleaned;
            return cleaned;
        };

        const getMoraColor = (val) => {
            if (val <= 0) return { bg: [254, 240, 138], text: [133, 77, 14] }; 
            if (val <= 3) return { bg: [254, 202, 202], text: [153, 27, 27] }; 
            if (val <= 10) return { bg: [252, 165, 165], text: [153, 27, 27] }; 
            if (val <= 30) return { bg: [248, 113, 113], text: [127, 29, 29] }; 
            return { bg: [220, 38, 38], text: [255, 255, 255] }; 
        };

        const LogoSVG = ({ className }) => (

                    <path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/>

        function LoginScreen({ onLogin }) {
            const [pwd, setPwd] = React.useState('');
            const [error, setError] = React.useState(false);

            const handleAccess = (e) => {
                e.preventDefault();
                if (pwd === 'CREDICAJA123') {
                    onLogin();
                } else {
                    setError(true);
                    setPwd('');
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-sans">
                    <div className="bg-white max-w-sm w-full p-8 rounded-2xl shadow-xl text-center border-t-[5px] border-[#16a34a]">
                        <div className="flex justify-center mb-6">
                            <LogoSVG className="h-20 w-auto" />
                        </div>
                        <h2 className="text-[22px] font-extrabold text-[#0f172a] mb-1">Acceso al Sistema</h2>
                        <p className="text-gray-500 text-xs mb-8">Gestión de Notificaciones - CREDIBAN PERÚ</p>
                        
                        <form onSubmit={handleAccess}>
                            <div className="mb-5">
                                <input 
                                    type="password" 
                                    placeholder="Ingrese la contraseña" 
                                    className={`w-full px-4 py-3 border-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-400 text-center text-gray-700 font-medium placeholder-gray-400 transition-colors ${error ? 'border-red-500' : 'border-[#22c55e]'}`}
                                    value={pwd}
                                    onChange={(e) => { setPwd(e.target.value); setError(false); }}
                                    autoFocus
                                />
                                {error && <p className="text-red-500 text-xs font-semibold mt-2">Contraseña incorrecta. Intente nuevamente.</p>}
                            </div>
                            <button 
                                type="submit"
                                className="w-full bg-[#16a34a] hover:bg-[#15803d] text-white font-bold py-3 px-4 rounded-xl shadow-sm transition-colors text-[15px]"
                            >
                                Ingresar al Panel
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const DEFAULT_TEMPLATE = `Estimado cliente: \n*{nombre}*\nEl area especializada de cobranza de CREDIBAN, le hace recordar que tiene {cuotasMora} cuota(s) pendiente(s) de pago lo cual esta generando interes moratorio.\nContactar con su asesor de credito.\nSiempre atento a brindarle asesoramiento continuo.\nSi ejecuto su pago omite el mensaje.\nCREDIBAN, creciendo contigo.`;

        function CobranzasDashboard() {
            const [clients, setClients] = React.useState(initialData);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [condicionFilter, setCondicionFilter] = React.useState('Cobrar Hoy'); 
            const [asesorFilter, setAsesorFilter] = React.useState('Todos');
            const [showOnlySelected, setShowOnlySelected] = React.useState(false);
            
            const [isQueueModalOpen, setIsQueueModalOpen] = React.useState(false);
            const [isTemplateModalOpen, setIsTemplateModalOpen] = React.useState(false);
            const [messageTemplate, setMessageTemplate] = React.useState(DEFAULT_TEMPLATE);
            const [queueClients, setQueueClients] = React.useState([]);
            const [queueIndex, setQueueIndex] = React.useState(0);
            
            const [activeTab, setActiveTab] = React.useState('panel');

            // --- RENDERIZADOR MAGNÉTICO DE LOGO PARA PDF ---
            const [logoBase64, setLogoBase64] = React.useState(null);
            React.useEffect(() => {
                const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240"><g fill="#59B447"><rect x="90" y="8" width="24" height="13" rx="6.5"/><rect x="71" y="31" width="61" height="13" rx="6.5"/><rect x="50" y="55" width="74" height="13" rx="6.5"/><rect x="31" y="79" width="75" height="13" rx="6.5"/><rect x="24" y="103" width="63" height="13" rx="6.5"/><rect x="37" y="128" width="24" height="13" rx="6.5"/><path d="M143 55 C141 78 130 95 111 107 C96 117 81 122 72 134 C62 147 63 166 70 181 C76 195 87 208 97 216 C107 201 118 189 131 177 C144 166 157 156 164 141 C173 123 173 104 168 89 C164 74 156 62 143 55 Z"/></g></svg>`;
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 180;
                    canvas.height = 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);
                    setLogoBase64(canvas.toDataURL('image/png'));
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(svgStr);
            }, []);

            React.useEffect(() => {
                const draft = localStorage.getItem('crediban_draft');
                if (draft) {
                    try {
                        const parsed = JSON.parse(draft);
                        if (parsed && parsed.length > 0) setClients(parsed);
                    } catch(e) {}
                }
            }, []);

            React.useEffect(() => {
                if (clients.length > 0) {
                    localStorage.setItem('crediban_draft', JSON.stringify(clients));
                }
            }, [clients]);

            const [timeNow, setTimeNow] = React.useState(new Date());
            const [historyData, setHistoryData] = React.useState([]);
            const [selectedHistoryDate, setSelectedHistoryDate] = React.useState('');

            React.useEffect(() => {
                const timer = setInterval(() => setTimeNow(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            const isCountdownActive = timeNow.getHours() === 17;
            const remainingMinutes = 59 - timeNow.getMinutes();
            const remainingSeconds = 59 - timeNow.getSeconds();

            const asesoresList = [...new Set(clients.map(c => c.asesor))].sort();

            const handleClearData = () => {
                if (clients.length === 0) {
                    alert("No hay datos para limpiar.");
                    return;
                }
                const pwd = window.prompt("⚠️ ACCIÓN IRREVERSIBLE ⚠️\nPara limpiar la base de datos de la sesión actual, ingrese la contraseña:");
                if (pwd === 'CREDICAJA123') {
                    setClients([]);
                    localStorage.removeItem('crediban_draft');
                } else if (pwd !== null) {
                    alert("Contraseña incorrecta. Acción cancelada.");
                }
            };

            const guardarCierreLocal = () => {
                if (clients.length === 0) return;
                const dateStr = new Date().toISOString().split('T')[0]; 
                
                const meta = clients.reduce((sum, c) => sum + c.totalCobrarHoy, 0);
                const total = clients.length;
                const gestionados = clients.filter(c => c.estadoLlamada !== 'Pendiente' || c.estadoWA !== 'Pendiente').length;
                const promesas = clients.filter(c => c.estadoLlamada.includes('Promesa') || c.estadoWA.includes('Promesa')).length;
                const cobertura = total > 0 ? ((gestionados / total) * 100).toFixed(1) : 0;
                
                const asesoresMetrics = asesoresList.map(asesor => {
                    const asC = clients.filter(c => c.asesor === asesor);
                    const aTot = asC.length;
                    const aGest = asC.filter(c => c.estadoLlamada !== 'Pendiente' || c.estadoWA !== 'Pendiente').length;
                    const aProm = asC.filter(c => c.estadoLlamada.includes('Promesa') || c.estadoWA.includes('Promesa')).length;
                    const aMeta = asC.reduce((sum, c) => sum + c.totalCobrarHoy, 0);
                    const aCob = aTot > 0 ? ((aGest / aTot) * 100).toFixed(1) : 0;
                    return { asesor, aTot, aGest, aCob, aProm, aMeta };
                });

                const dataCierre = {
                    fecha: dateStr,
                    resumen: { total, gestionados, cobertura, promesas, meta },
                    asesores: asesoresMetrics,
                    clientesRaw: clients
                };

                localStorage.setItem(`crediban_cierre_${dateStr}`, JSON.stringify(dataCierre));
                alert(`¡Éxito! El Cierre del día ${dateStr} se ha guardado correctamente.`);
                cargarHistorial();
            };

            React.useEffect(() => {
                if (timeNow.getHours() === 18 && timeNow.getMinutes() === 0 && timeNow.getSeconds() === 0) {
                    if (clients.length > 0) guardarCierreLocal();
                }
            }, [timeNow]);

            const cargarHistorial = () => {
                const keys = Object.keys(localStorage).filter(k => k.startsWith('crediban_cierre_'));
                const list = keys.map(k => JSON.parse(localStorage.getItem(k))).sort((a,b) => b.fecha.localeCompare(a.fecha));
                setHistoryData(list);
                if (list.length > 0 && !selectedHistoryDate) setSelectedHistoryDate(list[0].fecha);
            };

            React.useEffect(() => {
                if (activeTab === 'historial') cargarHistorial();
            }, [activeTab]);


            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const text = evt.target.result;
                        const parsedData = parseCSV(text);
                        if (parsedData.length === 0) {
                           alert("Error al leer el archivo. Asegúrate de guardarlo como CSV UTF-8 (Delimitado por comas).");
                           e.target.value = null; // Fix upload bug
                           return;
                        }
                        const consolidated = consolidateData(parsedData);
                        consolidated.sort((a, b) => b.totalCobrarHoy - a.totalCobrarHoy); 
                        setClients(consolidated);
                    } catch (error) {
                        alert("Hubo un problema procesando el archivo. Por favor verifica su formato.");
                    }
                    e.target.value = null; // Fix upload bug
                };
                reader.onerror = () => {
                    alert("No se pudo leer el archivo. Intente nuevamente.");
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            const handleStatusChange = (clientId, field, newValue) => {
                setClients(clients.map(client => 
                    client.id === clientId ? { ...client, [field]: newValue } : client
                ));
            };

            const toggleSelect = (clientId) => {
                setClients(clients.map(client => 
                    client.id === clientId ? { ...client, selected: !client.selected } : client
                ));
            };

            const filteredClients = clients.filter(client => {
                if (showOnlySelected) return client.selected;
                
                const matchesSearch = client.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                      client.celular.includes(searchTerm);
                                      
                let matchesCondicion = true;
                if (condicionFilter === 'Cobrar Hoy') matchesCondicion = client.maxAtraso >= 0;
                else if (condicionFilter === 'En Mora') matchesCondicion = client.maxAtraso > 0;
                else if (condicionFilter === 'Vence Hoy') matchesCondicion = client.maxAtraso === 0;
                else if (condicionFilter === 'Por Vencer') matchesCondicion = client.maxAtraso < 0;

                const matchesAsesor = asesorFilter === 'Todos' || client.asesor === asesorFilter;
                
                return matchesSearch && matchesCondicion && matchesAsesor;
            });

            const calcPesoCarteraExigible = filteredClients.reduce((sum, c) => sum + c.totalCobrarHoy, 0);
            const calcTotalCancelarCapInt = filteredClients.reduce((sum, c) => sum + c.montoCancelarCapInt, 0);
            const calcTotalCancelarCapital = filteredClients.reduce((sum, c) => sum + c.saldoCapital, 0);

                                                            <td className="px-4 py-4 whitespace-nowrap text-center text-gray-600">{asTotal}</td>
                                                            <td className="px-4 py-4 whitespace-nowrap text-center font-bold text-blue-600">{asGestionados}</td>
                                                            <td className="px-4 py-4 whitespace-nowrap text-center text-gray-600 font-medium">{asCobertura}%</td>
                                                            <td className="px-4 py-4 whitespace-nowrap text-center font-bold text-green-600">{asPromesas}</td>
                                                            <td className="px-4 py-4 whitespace-nowrap text-right font-bold text-red-600">S/ {asMeta.toFixed(2)}</td>
                                                        </tr>
                                                    )
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PESTAÑA 3: HISTORIAL DE CIERRES */}
                        {activeTab === 'historial' && (
                            <div>
                                <div className="mb-6 flex flex-wrap gap-4 items-end bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                                    <div className="flex-1">
                                        <label className="text-xs font-semibold text-gray-500 mb-1 block">Seleccionar Fecha Guardada</label>
                                        <select 
                                            className="w-full border border-gray-300 rounded-lg px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-green-500 text-lg font-bold"
                                            value={selectedHistoryDate}
                                            onChange={(e) => setSelectedHistoryDate(e.target.value)}
                                        >
                                            {historyData.length === 0 && <option value="">No hay cierres guardados</option>}
                                            {historyData.map(h => <option key={h.fecha} value={h.fecha}>{h.fecha}</option>)}
                                        </select>
                                    </div>
                                    {historyObj && (
                                        <button 
                                            onClick={() => generarPDFCierreDia(historyObj.clientesRaw)}
                                            className="bg-gray-800 hover:bg-gray-900 text-white px-6 py-2 rounded-xl font-bold shadow-lg transition-colors flex items-center gap-2 h-11"
                                        >
                                            📄 Exportar PDF de este Cierre
                                        </button>
                                    )}
                                </div>

                                {!historyObj ? (
                                    <div className="text-center py-16 text-gray-500 bg-white rounded-xl border border-gray-200">
                                        <span className="text-4xl block mb-2">📁</span>
                                        No hay datos históricos disponibles aún.
                                    </div>
                                ) : (
                                    <div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                                            <div className="bg-gray-100 p-5 rounded-2xl border border-gray-200">
                                                <p className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Total Cartera (Clientes)</p>
                                                <p className="text-3xl font-black text-gray-800">{historyObj.resumen.totalClientes}</p>
                                            </div>
                                            <div className="bg-gray-100 p-5 rounded-2xl border border-gray-200">
                                                <p className="text-sm font-bold text-blue-500 uppercase tracking-wider mb-1">Clientes Gestionados</p>
                                                <div className="flex items-end gap-2">
                                                    <p className="text-3xl font-black text-blue-700">{historyObj.resumen.totalGestionados}</p>
                                                    <p className="text-sm font-semibold text-blue-500 mb-1">({historyObj.resumen.porcentajeCobertura}% cobertura)</p>
                                                </div>
                                            </div>
                                            <div className="bg-gray-100 p-5 rounded-2xl border border-gray-200">
                                                <p className="text-sm font-bold text-green-500 uppercase tracking-wider mb-1">Promesas de Pago</p>
                                                <p className="text-3xl font-black text-green-600">{historyObj.resumen.totalPromesas}</p>
                                            </div>
                                            <div className="bg-gray-100 p-5 rounded-2xl border border-gray-200 border-l-4 border-l-red-500">
                                                <p className="text-sm font-bold text-red-500 uppercase tracking-wider mb-1">Meta Exigible a Recaudar</p>
                                                <p className="text-3xl font-black text-red-600">S/ {historyObj.resumen.totalMora.toFixed(2)}</p>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                            <div className="px-6 py-4 bg-gray-50 border-b border-gray-200">
                                                <h3 className="font-bold text-gray-700">Desglose de Productividad por Asesor ({historyObj.fecha})</h3>
                                            </div>
                                            <div className="overflow-x-auto">
                                                <table className="min-w-full divide-y divide-gray-200">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-6 py-3 text-left text-xs font-bold text-gray-600 uppercase">Asesor</th>
                                                            <th className="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase">Total Clientes</th>
                                                            <th className="px-4 py-3 text-center text-xs font-bold text-blue-600 uppercase">Gestionados</th>
                                                            <th className="px-4 py-3 text-center text-xs font-bold text-gray-600 uppercase">% Cobertura</th>
                                                            <th className="px-4 py-3 text-center text-xs font-bold text-green-600 uppercase">Promesas</th>
                                                            <th className="px-4 py-3 text-right text-xs font-bold text-red-600 uppercase">Meta (Soles)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-gray-200">
                                                        {historyObj.asesores.map(as => (
                                                            <tr key={as.asesor} className="hover:bg-gray-50">
                                                                <td className="px-6 py-4 whitespace-nowrap font-bold text-gray-800">{as.asesor}</td>
                                                                <td className="px-4 py-4 whitespace-nowrap text-center text-gray-600">{as.aTot}</td>
                                                                <td className="px-4 py-4 whitespace-nowrap text-center font-bold text-blue-600">{as.aGest}</td>
                                                                <td className="px-4 py-4 whitespace-nowrap text-center text-gray-600 font-medium">{as.aCob}%</td>
                                                                <td className="px-4 py-4 whitespace-nowrap text-center font-bold text-green-600">{as.aProm}</td>
                                                                <td className="px-4 py-4 whitespace-nowrap text-right font-bold text-red-600">S/ {as.aMeta.toFixed(2)}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function App() {
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            if (!isAuthenticated) return <LoginScreen onLogin={() => setIsAuthenticated(true)} />;
            return <CobranzasDashboard />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
